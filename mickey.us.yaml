      # -----------------------------------------------------------------
      # libultra corridor: ROM 0x6F420 - 0x76D10 (VRAM 0x8006E820 - 0x80076110).
      #
      # Named subsegments below are *measured* file boundaries, not guesses:
      # each one's byte range is byte-identical -- under relocation masking --
      # to the whole `.text` of the same-named object in a permitted public
      # decomp's built libultra. 79 were measured against Diddy Kong Racing's
      # build, the remaining 16 against Jet Force Gemini's -- which is also
      # where `libultra/piacs` got a measured boundary rather than only a name.
      # Reproduce the whole map with
      #   tools/find_known_objects.py <ref>/build/libultra \\
      #       --start 0x6F420 --end 0x76D10 --sections --rom-occ
      # and see symbol_addrs.us.txt for the per-function names and the
      # provenance convention, and docs/references.md for what <ref> can be.
      #
      # Boundaries. The corridor is where libultra is *contiguous*, not where
      # libultra exists at all -- read the two claims separately.
      #
      #   Lower. 0x6F420 is where the corridor begins, and nothing stronger
      #   is claimed for it. libultra itself is contiguous from 0x6B3D0
      #   through 0x76D10 apart from the 0x40-byte hole at 0x6F3E0 above; the
      #   subsegments below 0x6F420 were named later and separately. An
      #   earlier boundary argument here rested on "the function ending at
      #   0x6F3DC is game-shaped (saves s5/s6)" -- an accurate observation
      #   with the wrong inference drawn from it. That function is
      #   `corrupted`, the last routine of libultra's own io/pfschecker.c,
      #   matched whole against JFG's build at 0x6EA30.
      #
      #   Upper. Above 0x76D10 the code stops being resident text at all -- it
      #   indexes off $at and loads from absolute address 0, i.e. it is
      #   relocated somewhere before it runs -- which is why that region stays
      #   `bin`.
      #
      # An early estimate of 0x6FC50-0x75E20 was a floor rather than the
      # extent: it was derived from hand-written assembly only, which cannot
      # see the C files that surround it on both sides.
      #
      # Unnamed `asm` entries inside the range are libultra-shaped code that
      # matches NO object in ANY of the five reference builds, whole or
      # per-function. The DKR-only sweep left 0x1AE0 of the corridor (22.2%,
      # ten runs) unnamed; eight of those ten runs are named above from JFG's
      # build, and what remains is 0xB50 in two runs --
      # 0x70AF0-0x70E20 and 0x74090-0x748B0. docs/modules.md section 4.1 keeps
      # the current list, and tools/check_derived_numbers.py recomputes the
      # figure from this file so the two cannot drift apart.
      # -----------------------------------------------------------------
      - [0x6F420, asm, libultra/recvmesg]
      - [0x6F560, asm, libultra/aisetfreq]
      - [0x6F6C0, asm, libultra/createmesgqueue]
