name: Mickey's Speedway USA (North America)
sha1: 507341c0a40ca3e9a7cee969b396ee53facfb548

# ---------------------------------------------------------------------------
# Measured USA ROM facts (derived from baseroms/mickey.us.z64 itself, by
# disassembling the entrypoint at ROM 0x1000 / VRAM 0x80000400 and by
# entropy + "mipsiness" scanning of the whole 32MB image):
#
#   BSS start (VRAM)          0x80085A40   (lui t0,0x8008 / addiu t0,t0,0x5a40)
#   BSS size                  0x52D10      (lui t1,0x5    / ori   t1,t1,0x2d10)
#   BSS end (VRAM)            0x800D8750
#   Entry jump target (VRAM)  0x800211A0   (lui t2,0x8002 / addiu t2,t2,0x11a0)
#   Initial stack pointer     0x800CEA20   (addiu sp,sp,-0x15E0 after lui 0x800D)
#
#   The boot segment is mapped 1:1: VRAM = ROM + 0x7FFFF400, so the ROM only
#   supplies bytes up to BSS start:
#     ROM(bss_start) = 0x80085A40 - 0x80000400 + 0x1000 = 0x86640
#
# Segment map (ROM offsets):
#   0x001000 - 0x086640   static code + data (resident "main" module; includes
#                         a libultra .text block at ~0x6FC50-0x75E20, where
#                         16/18 probed functions are byte-identical to DKR's)
#   0x086640 - 0x16B0000  data tables + bulk compressed assets (~22.8MB).
#                         Entropy shows compression proper starting ~0x87000;
#                         0x86640-0x87000 looks like a table of ROM offsets.
#                         Left as one `bin` for now - Phase 3 splits it.
#   0x16B0000 - 0x18F1FE0 overlay region (front / track / clone modules plus
#                         their reloc tables; Rare/DKR-lineage runtime linker,
#                         cf. "ERROR:MIPS_HI16 without matching MIPS_LO16").
#                         Left as one `bin` for now - Phase 4 splits it.
#   0x18F1FE0 - 0x2000000 trailing 0xFF fill (verified byte-by-byte).
# ---------------------------------------------------------------------------

options:
  basename: mickey.us
  target_path: baseroms/mickey.us.z64
  base_path: .
  platform: n64
  compiler: IDO
  header_encoding: ASCII
  find_file_boundaries: True

  ld_script_path: mickey.us.ld
  asm_path: asm
  src_path: src
  build_path: build
  asset_path: assets

  symbol_addrs_path: symbol_addrs.us.txt
  undefined_funcs_auto_path: undefined_funcs_auto.us.txt
  undefined_syms_auto_path: undefined_syms_auto.us.txt
  symbol_name_format: $VRAM

  asm_function_macro: glabel
  asm_function_alt_macro: alabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  asm_emit_size_directive: False
  # splat's IDO preset otherwise prefixes every disassembled function with a
  # `nonmatching <name>, <size>` marker macro. asm-processor parses the
  # nonmatchings .s files itself and rejects anything before the first
  # `glabel` ("Error: .text block without an initial glabel"), so the marker
  # has to go for `#pragma GLOBAL_ASM` to work at all. Nothing depends on it:
  # progress is measured from what is in src/, not from marker symbols.
  asm_nonmatching_label_macro: ""

  section_order: [".text", ".data", ".rodata", ".bss"]
  # splat 0.35 renamed `auto_all_sections` to `auto_link_sections`.
  auto_link_sections: [".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: True
  #extensions_path: tools/splat_ext
  #libultra_symbols: True
  #hardware_regs: True

segments:
  - name: header
    type: header
    start: 0x0

  - name: boot
    type: bin
    start: 0x40

  # Entrypoint: zeroes BSS, sets SP, jumps to 0x800211A0. See header comment.
  - name: entry
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, hasm, entrypoint]

  # Resident static segment. The subsegment split points below were
  # auto-detected by splat's file-boundary heuristic and are kept as-is; they
  # are plausible translation-unit boundaries and get real names as the
  # decompilation progresses.
  - name: main
    type: code
    start: 0x1050
    vram: 0x80000450
    follows_vram: entry
    bss_size: 0x52D10
    subsegments:
      - [0x1050, asm]
      - [0x45F0, asm]
      - [0x4F40, asm]
      - [0xC950, asm]
      - [0x16140, asm]
      - [0x18FF0, asm]
      - [0x1BE50, asm]
      - [0x1C790, asm]
      - [0x20020, asm]
      - [0x21DA0, asm]
      - [0x21EE0, asm]
      - [0x25C20, asm]
      - [0x27760, asm]
      - [0x2A250, asm]
      - [0x2B650, asm]
      - [0x2BCD0, asm]
      - [0x2C8C0, asm]
      - [0x2F400, asm]
      - [0x323E0, asm]
      - [0x33FA0, asm]
      - [0x37D50, asm]
      - [0x3B480, asm]
      - [0x3D5F0, asm]
      - [0x43470, asm]
      - [0x45760, asm]
      - [0x465B0, asm]
      - [0x47A60, asm]
      - [0x47A70, asm]
      - [0x4BC40, asm]
      - [0x4EA60, asm]
      - [0x4F4E0, asm]
      - [0x4FC30, asm]
      - [0x506D0, asm]
      - [0x50C00, asm]
      - [0x58570, asm]
      - [0x58C10, asm]
      - [0x58E50, asm]
      - [0x59B90, asm]
      - [0x59BF0, asm]
      - [0x59DB0, asm]
      - [0x5B300, asm]
      - [0x5E6B0, asm]
      - [0x5E700, asm]
      - [0x61920, asm]
      - [0x61990, asm]
      - [0x619B0, asm]
      - [0x623D0, asm]
      - [0x625C0, asm]
      - [0x62670, asm]
      - [0x626F0, asm]
      - [0x63260, asm]
      - [0x63470, asm]
      - [0x63F30, asm]
      - [0x64000, asm]
      - [0x64130, asm]
      - [0x644C0, asm]
      - [0x64700, asm]
      - [0x65860, asm]
      - [0x666D0, asm]
      - [0x668C0, asm]
      - [0x66A50, asm]
      - [0x66A70, asm]
      - [0x66B00, asm]
      - [0x681B0, asm]
      - [0x691A0, asm]
      - [0x69220, asm]
      - [0x69240, asm]
      - [0x69440, asm]
      - [0x69930, asm]
      - [0x69CA0, asm]
      - [0x6A7F0, asm]
      - [0x6AC10, asm]
      - [0x6ACF0, asm]
      - [0x6B1A0, asm]
      - [0x6B860, asm]
      - [0x6BC20, asm]
      - [0x6BDF0, asm]
      - [0x6BF70, asm]
      - [0x6C750, asm]
      - [0x6C8F0, asm]
      - [0x6CAC0, asm]
      - [0x6CCA0, asm]
      - [0x6CE70, asm]
      - [0x6D2D0, asm]
      - [0x6D750, asm]
      - [0x6D9A0, asm]
      - [0x6DBD0, asm]
      - [0x6DE10, asm]
      - [0x6DE90, asm]
      - [0x6EA30, asm]
      - [0x6F420, asm]
      - [0x6F560, asm]
      - [0x6F6F0, asm]
      - [0x6F9B0, asm]
      - [0x6FA30, asm]
      - [0x6FB80, asm]
      - [0x6FB90, asm]
      # ~0x6FC50 - 0x75E20: libultra .text block (sqrtf, _bzero, _bcopy,
      # _bcmp, cache ops, TLB/SR helpers ... byte-identical to DKR's build).
      - [0x6FC60, asm]
      - [0x70280, asm]
      - [0x702F0, asm]
      - [0x706B0, asm]
      - [0x70910, asm]
      - [0x70990, asm]
      - [0x70A10, asm]
      - [0x70A40, asm]
      - [0x70AD0, asm]
      - [0x70AE0, asm]
      - [0x70AF0, asm]
      - [0x70C30, asm]
      - [0x70D70, asm]
      - [0x71430, asm]
      - [0x714E0, asm]
      - [0x71510, asm]
      - [0x71820, asm]
      - [0x71890, asm]
      - [0x71970, asm]
      - [0x71CD0, asm]
      - [0x71E80, asm]
      - [0x720B0, asm]
      # 0x72370-0x72410 is libultra's libc string TU (memcpy / strlen /
      # strchr, 0xA0 bytes incl. the 12-byte tail pad).  splat's automatic
      # boundary finder merged it into the preceding subsegment because it
      # follows ll.c with no alignment gap; the split point is measured -- the
      # .text of DKR's built libultra `string.c` object is byte-identical to
      # ROM 0x72370..0x72410, and IDO 5.3 -O2 -mips2 reproduces it exactly.
      # First C translation unit in the project (see src/libultra/string.c).
      - [0x72370, c, libultra/string]
      - [0x72410, asm]
      - [0x72420, asm]
      - [0x72810, asm]
      - [0x72850, asm]
      - [0x72920, asm]
      - [0x73050, asm]
      - [0x730A0, asm]
      - [0x730F0, asm]
      - [0x73140, asm]
      - [0x731E0, asm]
      - [0x73240, asm]
      - [0x73320, asm]
      - [0x73440, asm]
      - [0x735B0, asm]
      - [0x73740, asm]
      - [0x73890, asm]
      - [0x73980, asm]
      - [0x73B00, asm]
      - [0x73B20, asm]
      - [0x73BD0, asm]
      - [0x73C20, asm]
      - [0x73C80, asm]
      - [0x73C90, asm]
      - [0x743A0, asm]
      - [0x748B0, asm]
      - [0x748C0, asm]
      - [0x74C20, asm]
      - [0x74C60, asm]
      - [0x74CF0, asm]
      - [0x74D20, asm]
      - [0x74D30, asm]
      - [0x74D60, asm]
      - [0x74DC0, asm]
      - [0x74F20, asm]
      - [0x750D0, asm]
      - [0x75120, asm]
      - [0x75DE0, asm]
      - [0x75E10, asm]
      - [0x75E20, asm]
      - [0x760C0, asm]
      - [0x76B80, asm]
      # Not `hasm`: this disassembles into a call to func_840010E0, i.e. it is
      # not plain resident text. Kept as raw bin until it is identified.
      - [0x76D10, bin]
      - [0x76E60, data]
      # splat's jumptable heuristic suggests `- [0x8192C, rodata]` here, while
      # warning the real .rodata start may be well before that. Left undeclared
      # for now (bytes are still covered by the .data subsegment above, so the
      # link is byte-exact either way); pin it down in Phase 1.
      # BSS is zero-filled by the entrypoint; no ROM bytes back it.
      - { start: 0x86640, type: bss, vram: 0x80085A40 }

  # Data tables + bulk compressed assets. Phase 3 splits this properly.
  - name: assets
    type: bin
    start: 0x86640
    follows_vram: main

  # Overlay modules (front / track / clone) + their reloc tables.
  # Phase 4 splits this properly.
  - name: overlays
    type: bin
    start: 0x16B0000
    follows_vram: main

  # Trailing 0xFF fill to the end of the 32MB image.
  - name: rom_fill
    type: bin
    start: 0x18F1FE0
    follows_vram: main

  - [0x2000000]
