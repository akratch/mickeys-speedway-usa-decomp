      # Not `hasm`: this disassembles into a call to func_840010E0, i.e. it is
      # not plain resident text. Kept as raw bin until it is identified.
      - [0x76D10, bin]
      - [0x76E60, data]
      # splat's jumptable heuristic suggests `- [0x8192C, rodata]` here, while
      # warning the real .rodata start may be well before that. Still undeclared
      # (bytes are covered by the .data subsegment above, so the link is
      # byte-exact either way). The two things a future split needs are
      # measured and recorded here:
      #
      #   1. RODATA ORDER FOLLOWS TEXT ORDER, EXACTLY. Mapping all 44 jump
      #      tables in the static segment back to the functions that reference
      #      them gives 35 functions whose ROM addresses and whose jump-table
      #      addresses are both monotonically increasing -- ZERO INVERSIONS.
      #      First pair (ROM 0x7D18 -> jtbl_80080D2C), last (ROM 0x72B00 ->
      #      jtbl_80084970). So .rodata can be carved TU by TU in text order,
      #      which is what makes a per-file split tractable at all.
      #
      #   2. LOWER BOUND ON THE BOUNDARY: 0x80080D24 (ROM 0x81924). That is a
      #      float constant (7f7fffff, i.e. FLT_MAX) loaded by the function at
      #      ROM 0x50B0, and it sits TWO words below the first jump table
      #      jtbl_80080D2C (ROM 0x8192C). Nothing lower than it is referenced
      #      as read-only data from code, so .rodata starts at or before
      #      0x81924 -- consistent with splat's 0x8192C guess and tightening
      #      it by those two words.
      #
      # Both numbers are reproducible from asm/*.s alone. The split itself is
      # NOT done: it needs the yaml, the linker script and every future C TU to
      # agree at once.
      # BSS is zero-filled by the entrypoint; no ROM bytes back it.
      - { start: 0x86640, type: bss, vram: 0x80085A40 }

  # Data tables + bulk compressed assets. Phase 3 splits this properly.
  - name: assets
    type: bin
    start: 0x86640
    follows_vram: main

  # Overlay modules (front / track / clone) + their reloc tables.
  # Phase 4 splits this properly.
  - name: overlays
    type: bin
    start: 0x16B0000
    follows_vram: main

  # Trailing 0xFF fill to the end of the 32MB image.
  - name: rom_fill
    type: bin
    start: 0x18F1FE0
    follows_vram: main

  - [0x2000000]
