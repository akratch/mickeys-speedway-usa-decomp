# Reference build lock.
#
# The tier-A names in this tree were mined from the built objects of four other
# Rare decompilations (docs/references.md).  None of that material is in this
# repository and none of it ever will be; what is recorded here is the recipe
# and the checksums, so a farm rebuilt from scratch can be proved to be the one
# those names came from.
#
#   tools/setup_reference_builds.sh    build the farm from these pins
#   tools/verify_reference_builds.sh   check a farm against these digests
#
# `digest` is one aggregate sha256 per title, taken over the sorted
# "<path relative to the checkout> <sha256>" line for every *.o under
# `object_roots`.  One digest per title, not per object: a file of six thousand
# hashes would be both unreadable and indistinguishable from a data dump.
#
# The per-object hash covers the object's *mining surface* -- the bytes of
# `.text` and the name, value and size of every symbol in it -- and not the
# whole file.  It has to: IDO writes an `.mdebug` section carrying the absolute
# source path, the build host's name and a build timestamp, so an honest
# rebuild in a different directory produces different object files and a
# byte-identical ROM.  The mining surface is exactly what
# tools/find_known_objects.py reads, and it is reproducible -- measured, see
# docs/references.md.  tools/reference_build_digest.py computes it.
#
# `outcome` is what the build actually achieved, not what was hoped for:
#   full     ROM rebuilt byte-identical to the baserom
#   nearfull ROM links and builds; some compressed asset bytes differ
#   partial  every source file compiles; the final link does not complete
# Mining compares whole `.text` sections and never links, so `partial` objects
# are as usable as `full` ones -- see docs/references.md.

